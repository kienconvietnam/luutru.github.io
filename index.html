<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý Truyện & Video</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
    }
    h1, h2 {
      color: #4CAF50;
      cursor: default;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: none;
      font-size: 14px;
    }
    button {
      cursor: pointer;
    }
    .link-item {
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      background: #2d2d2d;
      display: flex;
      justify-content: space-between;
    }
    .link-actions button {
      margin-left: 5px;
      background-color: #4CAF50;
      color: white;
    }
    .link-actions button.delete {
      background-color: #f44336;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .pagination {
      margin-top: 20px;
      text-align: center;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #4CAF50;
      font-size: 1.2em;
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Quản lý Truyện & Video</h1>
  <div class="form-group">
    <input type="text" id="urlInput" placeholder="Dán link YouTube hoặc truyện..." style="width: 60%;" />
    <select id="typeSelect">
      <option value="truyen">Truyện</option>
      <option value="video">Video</option>
    </select>
    <button onclick="addLink()">Thêm</button>
  </div>

  <div class="links-container">
    <div>
      <h2 onclick="toggleSection('truyen')">
        Truyện <button class="toggle-btn" id="toggle-truyen">−</button>
      </h2>
      <div id="truyenList"></div>
    </div>
    <div>
      <h2 onclick="toggleSection('video')">
        Video <button class="toggle-btn" id="toggle-video">−</button>
      </h2>
      <div id="videoList"></div>
    </div>
  </div>

  <div class="pagination">
    <button onclick="changePage(currentPage - 1)">◀</button>
    <span>Trang <span id="currentPageDisplay">1</span> / <span id="totalPagesDisplay">1</span></span>
    <button onclick="changePage(currentPage + 1)">▶</button>
    <input type="number" id="jumpToPage" placeholder="Tới trang" min="1" onchange="jumpToPage()" />
  </div>

  <script>
    let db, currentPage = 1, totalPages = 1, itemsPerPage = 15;

    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("LinkDB", 1);
        request.onerror = () => reject("Lỗi mở DB");
        request.onsuccess = () => {
          db = request.result;
          resolve();
        };
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          const store = db.createObjectStore("links", { keyPath: "id", autoIncrement: true });
          store.createIndex("type", "type", { unique: false });
        };
      });
    }

    async function getAllLinks() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("links", "readonly");
        const store = tx.objectStore("links");
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject();
      });
    }

    async function addLink() {
      const url = document.getElementById("urlInput").value.trim();
      const type = document.getElementById("typeSelect").value;
      if (!url) return alert("Vui lòng nhập link!");

      let title = url;
      let image = "";

      if (type === "video") {
        const match = url.match(/(?:youtu\.be\/|v=)([^&]+)/);
        if (match) {
          const id = match[1];
          image = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
        }
      }

      try {
        const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data && data.title) title = data.title;
      } catch {}

      const tx = db.transaction("links", "readwrite");
      const store = tx.objectStore("links");
      store.add({ url, type, title, image });
      await tx.done;
      document.getElementById("urlInput").value = "";
      renderLinks();
    }

    async function deleteLink(id) {
      const tx = db.transaction("links", "readwrite");
      const store = tx.objectStore("links");
      store.delete(id);
      await tx.done;
      renderLinks();
    }

    async function editLink(id) {
      const tx = db.transaction("links", "readwrite");
      const store = tx.objectStore("links");
      const getRequest = store.get(id);
      getRequest.onsuccess = async () => {
        const item = getRequest.result;
        const newTitle = prompt("Tiêu đề mới:", item.title);
        const newUrl = prompt("Link mới:", item.url);
        if (newTitle && newUrl) {
          item.title = newTitle;
          item.url = newUrl;
          if (item.type === "video") {
            const match = newUrl.match(/(?:youtu\.be\/|v=)([^&]+)/);
            item.image = match ? `https://img.youtube.com/vi/${match[1]}/mqdefault.jpg` : "";
          }
          store.put(item);
          await tx.done;
          renderLinks();
        }
      };
    }

    async function renderLinks() {
      const allLinks = await getAllLinks();
      const truyenLinks = allLinks.filter(l => l.type === 'truyen');
      const videoLinks = allLinks.filter(l => l.type === 'video');

      totalPages = Math.ceil(allLinks.length / itemsPerPage);
      currentPage = Math.min(currentPage, totalPages || 1);
      const start = (currentPage - 1) * itemsPerPage;

      const truyenList = document.getElementById("truyenList");
      const videoList = document.getElementById("videoList");
      truyenList.innerHTML = "";
      videoList.innerHTML = "";

      const pageTruyen = truyenLinks.slice(start, start + itemsPerPage);
      const pageVideo = videoLinks.slice(start, start + itemsPerPage);

      const createHTML = (items) => items.map(item => `
        <div class="link-item">
          <div>
            <strong>${item.title}</strong><br/>
            <a href="${item.url}" target="_blank">${item.url}</a><br/>
            ${item.image ? `<img src="${item.image}" width="120" style="margin-top:8px;border-radius:8px;">` : ""}
          </div>
          <div class="link-actions">
            <button onclick="editLink(${item.id})">Sửa</button>
            <button class="delete" onclick="deleteLink(${item.id})">Xóa</button>
          </div>
        </div>
      `).join('');

      truyenList.innerHTML = pageTruyen.length ? createHTML(pageTruyen) : "Không có truyện nào.";
      videoList.innerHTML = pageVideo.length ? createHTML(pageVideo) : "Không có video nào.";

      document.getElementById("currentPageDisplay").innerText = currentPage;
      document.getElementById("totalPagesDisplay").innerText = totalPages || 1;
    }

    function changePage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderLinks();
    }

    function jumpToPage() {
      const page = parseInt(document.getElementById("jumpToPage").value);
      if (!isNaN(page)) changePage(page);
    }

    function toggleSection(type) {
      const list = document.getElementById(type + "List");
      const btn = document.getElementById("toggle-" + type);
      const key = `collapsed-${type}`;
      const isHidden = list.style.display === "none";
      list.style.display = isHidden ? "" : "none";
      btn.textContent = isHidden ? "−" : "+";
      localStorage.setItem(key, isHidden ? "false" : "true");
    }

    function restoreCollapsedState() {
      ["truyen", "video"].forEach(type => {
        const isCollapsed = localStorage.getItem(`collapsed-${type}`) === "true";
        const list = document.getElementById(type + "List");
        const btn = document.getElementById("toggle-" + type);
        list.style.display = isCollapsed ? "none" : "";
        btn.textContent = isCollapsed ? "+" : "−";
      });
    }

    window.onload = async () => {
      await initDB();
      restoreCollapsedState();
      renderLinks();
    };
  </script>
</body>
</html>
