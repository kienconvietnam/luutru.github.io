<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lưu Truyện & Video</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1e1e1e);
      color: #eee;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      color: #00ff88;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 6vw;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #2b2b2b;
      color: #fff;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #00ff88;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #00dd77;
    }
    #contentList > .swipe {
      background-color: #1a1a1a;
      border-radius: 12px;
      margin-top: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 10px rgba(0, 255, 136, 0.2);
      animation: fadeIn 0.6s ease;
      flex-wrap: wrap;
      position: relative;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    img.thumbnail {
      width: 100px;
      height: auto;
      max-height: 150px;
      object-fit: cover;
      border-radius: 8px;
      background: #444;
      flex-shrink: 0;
    }
    .info {
      flex: 1;
      min-width: 200px;
    }
    .info strong {
      font-size: 17px;
      display: block;
      margin-bottom: 10px;
      word-break: break-all;
    }
    a.view-button {
      display: inline-block;
      padding: 6px 14px;
      background: #00ff88;
      color: #000;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    a.view-button:hover {
      background: #00dd77;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media screen and (max-width: 600px) {
      .container {
        padding: 20px 10px;
      }
      h1 {
        font-size: 7vw;
      }
      img.thumbnail {
        width: 80px;
        max-height: 120px;
      }
      .info strong {
        font-size: 15px;
      }
    }
    .removed {
      opacity: 0;
      transform: translateX(-100%);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lưu Truyện & Video</h1>
    <input id="urlInput" type="text" placeholder="Dán URL truyện hoặc video...">
    <button onclick="addContent()">Lưu</button>
    <div id="contentList"></div>
  </div>

  <script>
    const contentList = document.getElementById('contentList');
    const antImages = [
      'https://png.pngtree.com/png-clipart/20230924/original/pngtree-flat-design-ant-vector-logo-isolated-black-icon-of-an-ant-png-image_12754836.png'
    ];
    const flowerImages = [
      'https://free.vector6.com/wp-content/uploads/2020/09/download-000912-hoa-hong-den-logo-vector-hoa-free-vector.jpg'
    ];
    let antIndex = 0;
    let flowerIndex = 0;

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      for (const item of saved) {
        renderContent(item.title, item.url, item.img);
      }
    };

    function getDefaultImage(url) {
      if (url.includes('youtube') || url.includes('youtu.be')) {
        const img = flowerImages[flowerIndex % flowerImages.length];
        flowerIndex++;
        return img;
      } else {
        const img = antImages[antIndex % antImages.length];
        antIndex++;
        return img;
      }
    }

    function renderContent(title, url, img) {
      const fallbackImg = getDefaultImage(url);
      const wrapper = document.createElement('div');
      wrapper.className = 'swipe';

      const image = document.createElement('img');
      image.className = 'thumbnail';
      image.src = img || fallbackImg;
      image.onerror = () => image.src = fallbackImg;

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `
        <strong>${title}</strong>
        <a href="${url}" target="_blank" class="view-button">Xem</a>
      `;

      wrapper.appendChild(image);
      wrapper.appendChild(info);
      contentList.appendChild(wrapper);

      // Swipe to delete
      let startX = 0;
      wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      });
      wrapper.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].clientX - startX;
        if (deltaX < -80) {
          removeContent(wrapper, url);
        }
      });

      // Also support mouse drag (optional)
      wrapper.addEventListener('mousedown', (e) => {
        startX = e.clientX;
        const onMouseUp = (ev) => {
          const deltaX = ev.clientX - startX;
          if (deltaX < -80) {
            removeContent(wrapper, url);
          }
          document.removeEventListener('mouseup', onMouseUp);
        };
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function removeContent(element, url) {
      element.classList.add('removed');
      setTimeout(() => {
        element.remove();
      }, 300);
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      const updated = saved.filter(item => item.url !== url);
      localStorage.setItem('savedContent', JSON.stringify(updated));
    }

    async function addContent() {
      const urlInput = document.getElementById('urlInput');
      let url = urlInput.value.trim();
      if (!url) return;

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      const title = url;
      const img = getDefaultImage(url);

      renderContent(title, url, img);

      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      saved.push({ title, url, img });
      localStorage.setItem('savedContent', JSON.stringify(saved));

      urlInput.value = '';
    }
  </script>
</body>
</html>
