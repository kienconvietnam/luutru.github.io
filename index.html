<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Truyện & Video</title>
  <style>
    :root {
      --primary-color: #1a1a1a;
      --secondary-color: #2d2d2d;
      --accent-color: #4CAF50;
      --text-color: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--primary-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select {
      flex-grow: 1;
      padding: 10px 15px;
      border-radius: 5px;
      border: none;
      background-color: var(--secondary-color);
      color: var(--text-color);
      min-width: 200px;
    }

    button {
      padding: 10px 15px;
      border-radius: 5px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      transition: opacity 0.3s;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .links-container {
      background-color: var(--secondary-color);
      border-radius: 8px;
      padding: 20px;
    }

    .link-item {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .link-item:hover {
      transform: translateX(5px);
    }

    .link-info {
      flex-grow: 1;
    }

    .link-title {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
      color: var(--accent-color);
    }

    .link-url {
      color: #aaa;
      font-size: 0.9em;
      word-break: break-word;
    }

    .link-type {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 0.8em;
      margin-left: 10px;
      background-color: rgba(76, 175, 80, 0.2);
    }

    .link-actions button {
      background-color: #ff4444;
      padding: 5px 10px;
      margin-left: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .pagination {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pagination input {
      width: 50px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .input-row {
        flex-direction: column;
      }

      .link-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .link-actions {
        margin-top: 10px;
        width: 100%;
        display: flex;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quản lý Truyện & Video</h1>
    </header>

    <div class="input-group">
      <div class="input-row">
        <input type="text" id="linkTitle" placeholder="Nhập tiêu đề">
        <input type="url" id="linkUrl" placeholder="Nhập link URL">
        <select id="linkType">
          <option value="truyen">Truyện</option>
          <option value="video">Video</option>
        </select>
        <input type="file" id="linkImage" accept="image/*" style="display:none">
        <button type="button" onclick="document.getElementById('linkImage').click()">Chọn ảnh</button>
        <button onclick="addLink()">Thêm Link</button>
      </div>
    </div>

    <div class="links-container">
      <h2>Danh sách Links</h2>
      <div id="linksList"></div>
      <div class="pagination">
        <button onclick="changePage(currentPage - 1)">◀</button>
        <span>Trang <span id="currentPageDisplay">1</span> / <span id="totalPagesDisplay">1</span></span>
        <button onclick="changePage(currentPage + 1)">▶</button>
        <input type="number" id="jumpToPage" placeholder="Tới trang" min="1" onchange="jumpToPage()">
      </div>
    </div>
  </div>
  <script>
const DB_NAME = 'LinkManagerDB';
const DB_VERSION = 1;
const STORE_NAME = 'links';
let db = null;
let currentPage = 1;
const itemsPerPage = 15;

window.onload = function () {
  initDB().then(() => {
    migrateLocalStorage(); // Chuyển dữ liệu cũ nếu có
    renderLinks();
  });
};

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onerror = () => reject('Lỗi mở IndexedDB');
    request.onsuccess = (event) => {
      db = event.target.result;
      resolve();
    };
    request.onupgradeneeded = (event) => {
      db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
  });
}

function migrateLocalStorage() {
  const oldData = JSON.parse(localStorage.getItem('links') || '[]');
  if (oldData.length === 0) return;

  const tx = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);

  oldData.forEach(item => store.add(item));
  localStorage.removeItem('links');
}

function addLink() {
  const title = document.getElementById('linkTitle').value.trim();
  const url = document.getElementById('linkUrl').value.trim();
  const type = document.getElementById('linkType').value;

  if (!title || !url) return alert('Nhập đầy đủ tiêu đề và URL');

  const fileInput = document.getElementById('linkImage');
  const reader = new FileReader();

  const save = (imageData = null) => {
    const link = { title, url, type, imageData, createdAt: Date.now() };
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add(link).onsuccess = () => renderLinks();
  };

  if (fileInput.files[0]) {
    reader.onload = (e) => save(e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else if (type === 'video' && url.includes('youtube')) {
    const id = extractYouTubeID(url);
    const thumbnail = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    fetch(thumbnail)
      .then(res => res.blob())
      .then(blob => {
        reader.onload = (e) => save(e.target.result);
        reader.readAsDataURL(blob);
      });
  } else {
    save();
  }

  document.getElementById('linkTitle').value = '';
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkImage').value = '';
}

function extractYouTubeID(url) {
  const regExp = /(?:youtube\.com.*[?&]v=|youtu\.be\/)([^&\n?#]+)/;
  const match = url.match(regExp);
  return match ? match[1] : '';
}

function renderLinks() {
  const tx = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  const links = [];

  store.openCursor(null, 'prev').onsuccess = function (event) {
    const cursor = event.target.result;
    if (cursor) {
      links.push(cursor.value);
      cursor.continue();
    } else {
      const totalPages = Math.ceil(links.length / itemsPerPage);
      currentPage = Math.min(currentPage, totalPages || 1);
      const start = (currentPage - 1) * itemsPerPage;
      const visibleLinks = links.slice(start, start + itemsPerPage);

      const list = document.getElementById('linksList');
      list.innerHTML = visibleLinks.length === 0
        ? '<div class="empty-state">Chưa có nội dung nào.</div>'
        : visibleLinks.map(link => `
          <div class="link-item">
            <div class="link-info">
              <span class="link-title">${link.title}</span>
              <a class="link-url" href="${link.url}" target="_blank">${link.url}</a>
              <span class="link-type">${link.type}</span>
            </div>
            <div class="link-actions">
              ${link.imageData ? `<img src="${link.imageData}" style="max-width:60px;max-height:60px;border-radius:4px;margin-right:10px">` : ''}
              <button onclick="deleteLink(${link.id})">Xóa</button>
            </div>
          </div>`).join('');

      document.getElementById('currentPageDisplay').textContent = currentPage;
      document.getElementById('totalPagesDisplay').textContent = totalPages || 1;
    }
  };
}

function deleteLink(id) {
  const tx = db.transaction(STORE_NAME, 'readwrite');
  tx.objectStore(STORE_NAME).delete(id).onsuccess = () => renderLinks();
}

function changePage(page) {
  currentPage = Math.max(1, page);
  renderLinks();
}

function jumpToPage() {
  const input = document.getElementById('jumpToPage');
  const page = parseInt(input.value);
  if (!isNaN(page)) {
    currentPage = page;
    renderLinks();
  }
}
</script>
</body>
</html>
