<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lưu Truyện & Video</title>
  <style>  
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1f1f1f;
      color: #00e676;
      padding: 1em;
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
      box-shadow: 0 2px 5px #000;
    }
    .container {
      padding: 1em;
    }
    input[type="text"], input[type="file"] {
      width: 80%;
      padding: 0.5em;
      border: none;
      border-radius: 5px;
      margin-bottom: 0.5em;
      background: #2c2c2c;
      color: #fff;
    }
    button {
      padding: 0.5em 1em;
      background: #00e676;
      color: #000;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #00c853;
    }
    h2 {
      margin-top: 1.5em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .swipe {
      background: #1e1e1e;
      padding: 0.7em;
      margin: 0.5em 0;
      display: flex;
      align-items: center;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }
    .swipe.removed {
      transform: translateX(-100%);
      opacity: 0;
    }
    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      margin-right: 1em;
    }
    .info {
      flex: 1;
    }
    .info strong {
      display: block;
      margin-bottom: 0.3em;
    }
    .view-button {
      text-decoration: none;
      color: #40c4ff;
    }
    .collapsed {
      display: none;
    }
    #searchInput {
      margin-bottom: 1em;
      padding: 0.5em;
      width: 95%;
      border: none;
      border-radius: 5px;
      background: #2c2c2c;
      color: white;
    }
    #modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }
    .modal-content {
      background: #1e1e1e;
      padding: 1em 2em;
      border-radius: 10px;
      text-align: center;
    }
    .modal-content h3 {
      color: #00e676;
    }
    .modal-buttons {
      margin-top: 1em;
    }
    .modal-buttons button {
      margin: 0 1em;
      background: #333;
      color: #00e676;
      border: 1px solid #00e676;
    }
    .modal-buttons button:hover {
      background: #00e676;
      color: black;
    }
  </style>
</head>
<body>
  <header>Lưu Truyện & Video</header>
  <p style="text-align: center; color: #aaa; margin-top: -10px; font-size: 14px;">
  </p>
  <div class="container">
    <input id="urlInput" type="text" placeholder="Dán link truyện hoặc video...">
    <input id="fileInput" type="file" accept="image/*">
    <button onclick="showModal()">Lưu</button>
    <br>
    <input id="searchInput" type="text" placeholder="Tìm kiếm..." oninput="searchContent()">

    <h2>📖 Truyện <span id="storiesToggle" onclick="toggleSection('storiesContent')" style="cursor:pointer;">➖</span></h2>
    <div id="storiesContent"></div>

    <h2>📺 Video <span id="videosToggle" onclick="toggleSection('videosContent')" style="cursor:pointer;">➖</span></h2>
    <div id="videosContent"></div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>Chọn loại nội dung</h3>
      <div class="modal-buttons">
        <button onclick="classifyAndSave('truyện')">📖 Truyện</button>
        <button onclick="classifyAndSave('video')">📺 Video</button>
      </div>
    </div>
  </div>

  <script>
    const storiesContent = document.getElementById('storiesContent');
    const videosContent = document.getElementById('videosContent');

    function toggleSection(id) {
      const content = document.getElementById(id);
      const toggle = document.getElementById(id === 'storiesContent' ? 'storiesToggle' : 'videosToggle');
      content.classList.toggle('collapsed');
      toggle.textContent = content.classList.contains('collapsed') ? '➕' : '➖';
    }

    function getYouTubeThumbnail(url) {
      const videoId = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return videoId ? `https://img.youtube.com/vi/${videoId[1]}/hqdefault.jpg` : null;
    }

    async function fetchPageTitle(url) {
      try {
        const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        const text = await response.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        return doc.querySelector('title')?.innerText || url;
      } catch {
        return url;
      }
    }

    function renderContent(title, url, img, isVideo) {
      const wrapper = document.createElement('div');
      wrapper.className = 'swipe';

      const image = document.createElement('img');
      image.className = 'thumbnail';
      image.src = img || '';
      image.onerror = () => image.src = '';

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `<strong>${title}</strong><a href="${url}" target="_blank" class="view-button">Xem</a>`;

      wrapper.appendChild(image);
      wrapper.appendChild(info);

      const target = isVideo ? videosContent : storiesContent;
      target.appendChild(wrapper);

      let startX = 0;
      wrapper.addEventListener('touchstart', e => startX = e.touches[0].clientX);
      wrapper.addEventListener('touchend', e => {
        if (e.changedTouches[0].clientX - startX < -80) removeContent(wrapper, url);
      });
      wrapper.addEventListener('mousedown', e => {
        startX = e.clientX;
        const onMouseUp = ev => {
          if (ev.clientX - startX < -80) removeContent(wrapper, url);
          document.removeEventListener('mouseup', onMouseUp);
        };
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function removeContent(element, url) {
      element.classList.add('removed');
      setTimeout(() => element.remove(), 300);
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      const updated = saved.filter(item => item.url !== url);
      localStorage.setItem('savedContent', JSON.stringify(updated));
    }

    async function classifyAndSave(type) {
      const input = document.getElementById('urlInput');
      const fileInput = document.getElementById('fileInput');
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const isVideo = type === 'video';
      const file = fileInput.files[0];
      const img = file ? URL.createObjectURL(file) : (isVideo ? getYouTubeThumbnail(url) : null);
      const title = await fetchPageTitle(url);

      renderContent(title, url, img, isVideo);

      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      saved.push({ title, url, img, isVideo });
      localStorage.setItem('savedContent', JSON.stringify(saved));

      input.value = '';
      fileInput.value = '';
      document.getElementById('modal').style.display = 'none';
      searchContent();
    }

    function showModal() {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        document.getElementById('modal').style.display = 'flex';
      } else {
        alert("Vui lòng dán URL trước.");
      }
    }

    function searchContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.swipe').forEach(div => {
        const text = div.innerText.toLowerCase();
        div.style.display = text.includes(query) ? '' : 'none';
      });
    }

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      for (const item of saved) {
        renderContent(item.title, item.url, item.img, item.isVideo);
      }
    };
  </script>
</body>
</html>
