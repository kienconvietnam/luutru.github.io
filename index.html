<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổ chức Liên kết Truyện/Video</title>
    <style>
        :root {
            --primary: #212121;
            --secondary: #121212;
            --accent: #424242;
            --text: #f5f5f5;
            --highlight: #616161;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--accent);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .input-section {
            background-color: var(--secondary);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input {
            flex: 1;
            background-color: var(--accent);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            color: var(--text);
            font-size: 1rem;
        }

        input::placeholder {
            color: #bdbdbd;
        }

        button {
            background-color: var(--highlight);
            color: var(--text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #757575;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .radio-option input {
            flex: none;
        }

        .folders-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .folder {
            background-color: var(--secondary);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--accent);
            cursor: pointer;
        }

        .folder-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .toggle-btn {
            background: none;
            color: var(--text);
            font-size: 1.5rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .folder-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
        }

        .folder-collapsed .folder-content {
            display: none;
        }

        .item {
            background-color: var(--accent);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .item:hover {
            transform: translateY(-4px);
        }

        .item-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .item-info {
            padding: 0.75rem;
        }

        .item-title {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-type {
            font-size: 0.8rem;
            color: #bdbdbd;
        }

        .video .item-type {
            color: #ff6b6b;
        }

        .novel .item-type {
            color: #64b5f6;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .page-input {
            width: 60px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #9e9e9e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--secondary);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }

            .folder-content {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lưu Trữ Truyện/Video</h1>
            <p>Sắp xếp liên kết truyện và video của bạn</p>
        </header>

        <section class="input-section">
            <div class="input-group">
                <input type="text" id="link-input" placeholder="Dán liên kết truyện/video vào đây...">
                <button id="save-btn">Lưu</button>
            </div>
            <div class="input-group">
          <div id="image-drop-area" contenteditable="true"
     style="flex:1; background-color: var(--accent); border-radius: 4px; padding: 0.75rem 1rem; color: var(--text); font-size: 1rem;">
  Dán ảnh vào đây...
</div>

           
                
            </div>
        </section>

        <section class="folders-container">
            <!-- Thư mục sẽ được tạo tự động ở đây -->
        </section>

        <div class="pagination">
            <button id="prev-page">&lt; Trước</button>
            <input type="number" class="page-input" id="current-page" value="1" min="1">
            <button id="next-page">Sau &gt;</button>
        </div>

        <div class="modal" id="confirm-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Xác nhận Loại Nội dung</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <p>Đây là Truyện/Manga hay Video?</p>
                <div class="radio-group" style="margin: 1.5rem 0;">
                    <div class="radio-option">
                        <input type="radio" id="modal-novel-option" name="modal-media-type" value="novel" checked>
                        <label for="modal-novel-option">Truyện/Manga</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="modal-video-option" name="modal-media-type" value="video">
                        <label for="modal-video-option">Video</label>
                    </div>
                </div>
                <button id="confirm-btn" style="width: 100%;">Xác nhận</button>
            </div>
        </div>
    </div>

    <script>
        // Trạng thái ứng dụng
        let mediaItems = [];
        let currentPage = 1;
        const itemsPerPage = 14; // 7 truyện + 7 video mỗi thư mục
        let currentLink = '';
        let currentImageUrl = '';

        // Phần tử DOM
        const linkInput = document.getElementById('link-input');
        const imageDropArea = document.getElementById('image-drop-area');
        const saveBtn = document.getElementById('save-btn');
        const foldersContainer = document.querySelector('.folders-container');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const currentPageInput = document.getElementById('current-page');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmBtn = document.getElementById('confirm-btn');
        const modalClose = document.querySelector('.modal-close');

        // Khởi tạo từ localStorage
        function loadMediaItems() {
            const savedItems = localStorage.getItem('mediaItems');
            if (savedItems) {
                mediaItems = JSON.parse(savedItems);
                renderFolders();
            }
        }

        // Lưu vào localStorage
        function saveMediaItems() {
            localStorage.setItem('mediaItems', JSON.stringify(mediaItems));
        }

        // Hiển thị thư mục dựa trên trang hiện tại
        function renderFolders() {
            foldersContainer.innerHTML = '';

            // Lọc các mục cho trang hiện tại
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = mediaItems.slice(startIndex, endIndex);

            if (pageItems.length === 0) {
                foldersContainer.innerHTML = `
                    <div class="empty-state">
                        <p>Chưa có nội dung nào được lưu. Hãy thêm bằng biểu mẫu phía trên.</p>
                    </div>
                `;
                return;
            }

            // Tách truyện và video
            const novels = pageItems.filter(item => item.type === 'novel');
            const videos = pageItems.filter(item => item.type === 'video');

            // Tạo thư mục nếu có mục
            if (novels.length > 0) {
                createFolder('Truyện/Manga', novels, true);
            }
            if (videos.length > 0) {
                createFolder('Videos', videos, false);
            }
        }

        // Tạo phần tử thư mục
        function createFolder(title, items, isCollapsed = false) {
    const folder = document.createElement('div');
    folder.className = `folder ${isCollapsed ? 'folder-collapsed' : ''}`;
    folder.innerHTML = `
        <div class="folder-header">
            <div class="folder-title">${title}</div>
            <button class="toggle-btn">${isCollapsed ? '+' : '-'}</button>
        </div>
        <div class="folder-content">
            ${items.map(item => `
                <div class="item ${item.type}" data-id="${item.id}">
                    <a href="${item.link}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">
                        <img src="${item.imageUrl || 'https://placehold.co/600x400?text=Không+có+ảnh'}" alt="${item.title || 'Ảnh đại diện'}" class="item-image">
                        <div class="item-info">
                            <div class="item-title" title="${item.link}">${item.title || 'Không có tiêu đề'}</div>
                            <div class="item-type">${item.type === 'novel' ? 'Truyện/Manga' : 'Video'}</div>
                        </div>
                    </a>
                    <button class="delete-btn" title="Xóa mục này">🗑️</button>
                </div>
            `).join('')}
        </div>
    `;

    // Bắt sự kiện nút thu gọn/mở rộng
    const toggleBtn = folder.querySelector('.toggle-btn');
    toggleBtn.addEventListener('click', () => {
        folder.classList.toggle('folder-collapsed');
        toggleBtn.textContent = folder.classList.contains('folder-collapsed') ? '+' : '-';
    });

    // Bắt sự kiện xóa mục
    folder.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation(); // Tránh kích hoạt mở thư mục
            const itemDiv = e.target.closest('.item');
            const itemId = parseInt(itemDiv.dataset.id);
            const confirmed = confirm('Bạn có chắc muốn xoá mục này không?');
            if (confirmed) {
                mediaItems = mediaItems.filter(item => item.id !== itemId);
                saveMediaItems();
                renderFolders();
                updatePagination();
            }
        });
    });

    foldersContainer.appendChild(folder);
}

        // Cập nhật phân trang
        function updatePagination() {
            const totalPages = Math.ceil(mediaItems.length / itemsPerPage);
            currentPageInput.max = totalPages;
            
            // Vô hiệu hóa nút khi cần
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
            
            // Đảm bảo trang hiện tại không vượt quá tổng số trang
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
                currentPageInput.value = currentPage;
                renderFolders();
            }
        }

        // Bộ lắng nghe sự kiện
        saveBtn.addEventListener('click', () => {
            currentLink = linkInput.value.trim();
            // currentImageUrl đã được cập nhật từ sự kiện paste

            
            if (!currentLink) {
                alert('Vui lòng dán liên kết hợp lệ');
                return;
            }

            // Hiển thị hộp thoại xác nhận
            confirmModal.style.display = 'flex';
        });

        confirmBtn.addEventListener('click', () => {
            const mediaType = document.querySelector('input[name="modal-media-type"]:checked').value;
            
            mediaItems.push({
                id: Date.now(),
                link: currentLink,
                type: mediaType,
                imageUrl: currentImageUrl,
                title: mediaType === 'novel' ? 'XEM' : 'XEM',
                dateAdded: new Date().toISOString()
            });

            // Lưu vào localStorage và cập nhật giao diện
            saveMediaItems();
            renderFolders();
            updatePagination();
            
            // Đặt lại đầu vào và đóng hộp thoại
            linkInput.value = '';
            imageInput.value = '';
            confirmModal.style.display = 'none';
        });

        modalClose.addEventListener('click', () => {
            confirmModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.style.display = 'none';
            }
        });

        // Điều khiển phân trang
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                currentPageInput.value = currentPage;
                renderFolders();
            }
        });

        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(mediaItems.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                currentPageInput.value = currentPage;
                renderFolders();
            }
        });

        currentPageInput.addEventListener('change', () => {
            const totalPages = Math.ceil(mediaItems.length / itemsPerPage);
            const newPage = parseInt(currentPageInput.value);
            
            if (newPage >= 1 && newPage <= totalPages && !isNaN(newPage)) {
                currentPage = newPage;
                renderFolders();
            } else {
                currentPageInput.value = currentPage;
            }
        });

        // Khởi tạo ứng dụng
        document.addEventListener('DOMContentLoaded', () => {
            loadMediaItems();
            updatePagination();
        });

        // Xử lý dán ảnh vào vùng imageDropArea
imageDropArea.addEventListener('paste', (event) => {
    const items = event.clipboardData.items;
    for (let i = 0; i < items.length; i++) {
        const item = items[i];

        // Nếu là ảnh dạng file
        if (item.type.indexOf("image") !== -1) {
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                currentImageUrl = base64Data;
                imageDropArea.innerHTML = `<img src="${base64Data}" style="max-width:100%; border-radius:6px;">`;
            };
            reader.readAsDataURL(file);
            event.preventDefault();
        }

        // Nếu là HTML chứa ảnh (thường khi copy từ web)
        if (item.type === "text/html") {
            item.getAsString(html => {
                const doc = new DOMParser().parseFromString(html, "text/html");
                const img = doc.querySelector("img");
                if (img && img.src.startsWith("http")) {
                    currentImageUrl = img.src;
                    imageDropArea.innerHTML = `<img src="${img.src}" style="max-width:100%; border-radius:6px;">`;
                }
            });
        }
    }
});

    </script>
</body>
</html>
