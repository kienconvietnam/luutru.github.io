<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lưu Truyện & Video</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1f1f1f;
      color: #00e676;
      padding: 1em;
      text-align: center;
      font-size: 1.8em;
      font-weight: bold;
      box-shadow: 0 2px 5px #000;
    }
    .container {
      padding: 1em;
    }
    input[type="text"], input[type="file"] {
      width: 80%;
      padding: 0.5em;
      border: none;
      border-radius: 5px;
      margin-bottom: 0.5em;
      background: #2c2c2c;
      color: #fff;
    }
    button {
      padding: 0.5em 1em;
      background: #00e676;
      color: #000;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #00c853;
    }
    h2 {
      margin-top: 1.5em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .swipe {
      background: #1e1e1e;
      padding: 0.7em;
      margin: 0.5em 0;
      display: flex;
      align-items: center;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }
    .swipe.removed {
      transform: translateX(-100%);
      opacity: 0;
    }
    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      margin-right: 1em;
    }
    .info {
      flex: 1;
    }
    .info strong {
      display: block;
      margin-bottom: 0.3em;
    }
    .view-button {
      text-decoration: none;
      color: #40c4ff;
    }
    .collapsed {
      display: none;
    }
    #searchInput {
      margin-bottom: 1em;
      padding: 0.5em;
      width: 95%;
      border: none;
      border-radius: 5px;
      background: #2c2c2c;
      color: white;
    }
    #modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }
    .modal-content {
      background: #1e1e1e;
      padding: 1em 2em;
      border-radius: 10px;
      text-align: center;
    }
    .modal-content h3 {
      color: #00e676;
    }
    .modal-buttons {
      margin-top: 1em;
    }
    .modal-buttons button {
      margin: 0 1em;
      background: #333;
      color: #00e676;
      border: 1px solid #00e676;
    }
    .modal-buttons button:hover {
      background: #00e676;
      color: black;
    }
    .page-container {
      overflow: hidden;
      position: relative;
      min-height: 300px;
    }
    .page {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    .page.active {
      display: block;
    }
    .pagination-buttons {
      text-align: center;
      margin-top: 1em;
    }
    .pagination-buttons button {
      margin: 0 0.5em;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 5px;
      padding: 0.4em 0.8em;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <header>Lưu Truyện & Video</header>
  <div class="container">
    <input id="urlInput" type="text" placeholder="Dán link truyện hoặc video...">
    <input id="fileInput" type="file" accept="image/*">
    <button onclick="showModal()">Lưu</button>
    <br>
    <input id="searchInput" type="text" placeholder="Tìm kiếm..." oninput="searchContent()">

    <h2>📖 Truyện <span id="storiesToggle" onclick="toggleSection('storiesContainer')" style="cursor:pointer;">➖</span></h2>
    <div id="storiesContainer" class="page-container"></div>
    <div class="pagination-buttons" id="storiesPagination"></div>

    <h2>📺 Video <span id="videosToggle" onclick="toggleSection('videosContainer')" style="cursor:pointer;">➖</span></h2>
    <div id="videosContainer" class="page-container"></div>
    <div class="pagination-buttons" id="videosPagination"></div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>Chọn loại nội dung</h3>
      <div class="modal-buttons">
        <button onclick="classifyAndSave('truyện')">📖 Truyện</button>
        <button onclick="classifyAndSave('video')">📺 Video</button>
      </div>
    </div>
  </div>

  <script>
    const storiesPerPage = 18;
    const videosPerPage = 18;
    let stories = [];
    let videos = [];
    let currentStoryPage = 0;
    let currentVideoPage = 0;

    function toggleSection(id) {
      const content = document.getElementById(id);
      const toggle = document.getElementById(id === 'storiesContainer' ? 'storiesToggle' : 'videosToggle');
      content.classList.toggle('collapsed');
      toggle.textContent = content.classList.contains('collapsed') ? '➕' : '➖';
    }

    function getYouTubeThumbnail(url) {
      const videoId = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return videoId ? `https://img.youtube.com/vi/${videoId[1]}/hqdefault.jpg` : null;
    }

    async function fetchPageTitle(url) {
      try {
        const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        const text = await response.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        return doc.querySelector('title')?.innerText || url;
      } catch {
        return url;
      }
    }

    function showModal() {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        document.getElementById('modal').style.display = 'flex';
      } else {
        alert("Vui lòng dán URL trước.");
      }
    }

    function removeContent(element, url) {
      element.classList.add('removed');
      setTimeout(() => element.remove(), 300);
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      const updated = saved.filter(item => item.url !== url);
      localStorage.setItem('savedContent', JSON.stringify(updated));
      stories = updated.filter(x => !x.isVideo);
      videos = updated.filter(x => x.isVideo);
      paginate(stories, 'storiesContainer', 'storiesPagination', false);
      paginate(videos, 'videosContainer', 'videosPagination', true);
    }

    async function classifyAndSave(type) {
      const input = document.getElementById('urlInput');
      const fileInput = document.getElementById('fileInput');
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const isVideo = type === 'video';
      const file = fileInput.files[0];
      const title = await fetchPageTitle(url);

      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          const img = reader.result;
          saveAndRender(title, url, img, isVideo);
        };
        reader.readAsDataURL(file);
      } else {
        const img = isVideo ? getYouTubeThumbnail(url) : null;
        saveAndRender(title, url, img, isVideo);
      }

      input.value = '';
      fileInput.value = '';
      document.getElementById('modal').style.display = 'none';
    }

    function saveAndRender(title, url, img, isVideo) {
      const item = { title, url, img, isVideo };
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      saved.push(item);
      localStorage.setItem('savedContent', JSON.stringify(saved));
      if (isVideo) {
        videos.push(item);
        paginate(videos, 'videosContainer', 'videosPagination', true);
      } else {
        stories.push(item);
        paginate(stories, 'storiesContainer', 'storiesPagination', false);
      }
      searchContent();
    }

    function createContentElement(title, url, img, isVideo) {
      const wrapper = document.createElement('div');
      wrapper.className = 'swipe';

      const image = document.createElement('img');
      image.className = 'thumbnail';
      image.src = img || '';
      image.onerror = () => image.src = '';

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `<strong>${title}</strong><a href="${url}" target="_blank" class="view-button">Xem</a>`;

      const removeBtn = document.createElement('button');
      removeBtn.textContent = '❌';
      removeBtn.style.marginLeft = '10px';
      removeBtn.style.background = 'transparent';
      removeBtn.style.color = '#f44336';
      removeBtn.style.border = 'none';
      removeBtn.style.fontSize = '1.2em';
      removeBtn.style.cursor = 'pointer';
      removeBtn.title = "Xóa mục này";
      removeBtn.onclick = () => removeContent(wrapper, url);

      wrapper.appendChild(image);
      wrapper.appendChild(info);
      wrapper.appendChild(removeBtn);
      return wrapper;
    }

    function paginate(items, containerId, paginationId, isVideo) {
      const container = document.getElementById(containerId);
      const pagination = document.getElementById(paginationId);
      container.innerHTML = '';
      pagination.innerHTML = '';

      const perPage = isVideo ? videosPerPage : storiesPerPage;
      const pages = Math.ceil(items.length / perPage);
      for (let i = 0; i < pages; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page' + (i === 0 ? ' active' : '');
        const slice = items.slice(i * perPage, (i + 1) * perPage);
        for (const item of slice) {
          pageDiv.appendChild(createContentElement(item.title, item.url, item.img, item.isVideo));
        }
        container.appendChild(pageDiv);
      }

      if (pages > 1) {
        const prevBtn = document.createElement('button');
        const nextBtn = document.createElement('button');
        prevBtn.textContent = '⬅️ Trang trước';
        nextBtn.textContent = 'Trang sau ➡️';
        let current = 0;

        prevBtn.onclick = () => {
          const pageDivs = container.querySelectorAll('.page');
          if (current > 0) {
            pageDivs[current].classList.remove('active');
            current--;
            pageDivs[current].classList.add('active');
            if (isVideo) currentVideoPage = current;
            else currentStoryPage = current;
          }
        };

        nextBtn.onclick = () => {
          const pageDivs = container.querySelectorAll('.page');
          if (current < pageDivs.length - 1) {
            pageDivs[current].classList.remove('active');
            current++;
            pageDivs[current].classList.add('active');
            if (isVideo) currentVideoPage = current;
            else currentStoryPage = current;
          }
        };

        pagination.appendChild(prevBtn);
        pagination.appendChild(nextBtn);
      }
    }

    function searchContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.swipe').forEach(div => {
        const text = div.innerText.toLowerCase();
        div.style.display = text.includes(query) ? '' : 'none';
      });
    }

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('savedContent') || '[]');
      stories = saved.filter(x => !x.isVideo);
      videos = saved.filter(x => x.isVideo);
      paginate(stories, 'storiesContainer', 'storiesPagination', false);
      paginate(videos, 'videosContainer', 'videosPagination', true);
    };
  </script>
</body>
</html>
