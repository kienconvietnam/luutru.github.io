<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Truyện & Video</title>
  <style>
    :root {
      --primary-color: #1a1a1a;
      --secondary-color: #2d2d2d;
      --accent-color: #4CAF50;
      --text-color: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--primary-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select {
      flex-grow: 1;
      padding: 10px 15px;
      border-radius: 5px;
      border: none;
      background-color: var(--secondary-color);
      color: var(--text-color);
      min-width: 200px;
    }

    button {
      padding: 10px 15px;
      border-radius: 5px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      transition: opacity 0.3s;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .links-container {
      background-color: var(--secondary-color);
      border-radius: 8px;
      padding: 20px;
    }

    .link-item {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .link-item:hover {
      transform: translateX(5px);
    }

    .link-info {
      flex-grow: 1;
    }

    .link-title {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
      color: var(--accent-color);
    }

    .link-url {
      color: #aaa;
      font-size: 0.9em;
      word-break: break-word;
    }

    .link-type {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 0.8em;
      margin-left: 10px;
      background-color: rgba(76, 175, 80, 0.2);
    }

    .link-actions button {
      background-color: #ff4444;
      padding: 5px 10px;
      margin-left: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .pagination {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pagination input {
      width: 50px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .input-row {
        flex-direction: column;
      }

      .link-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .link-actions {
        margin-top: 10px;
        width: 100%;
        display: flex;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quản lý Truyện & Video</h1>
    </header>

    <div class="input-group">
      <div class="input-row">
        <input type="text" id="linkTitle" placeholder="Nhập tiêu đề">
        <input type="url" id="linkUrl" placeholder="Nhập link URL">
        <select id="linkType">
          <option value="truyen">Truyện</option>
          <option value="video">Video</option>
        </select>
        <input type="file" id="linkImage" accept="image/*" style="display:none">
        <button type="button" onclick="document.getElementById('linkImage').click()">Chọn ảnh</button>
        <button onclick="addLink()">Thêm Link</button>
      </div>
    </div>

    <div class="links-container">
      <h2>Danh sách Links</h2>
      <div id="linksList"></div>
      <div class="pagination">
        <button onclick="changePage(currentPage - 1)">◀</button>
        <span>Trang <span id="currentPageDisplay">1</span> / <span id="totalPagesDisplay">1</span></span>
        <button onclick="changePage(currentPage + 1)">▶</button>
        <input type="number" id="jumpToPage" placeholder="Tới trang" min="1" onchange="jumpToPage()">
      </div>
    </div>
  </div>

 <script>
  let db;
  let currentPage = 1;
  const itemsPerPage = 10;

  document.addEventListener('DOMContentLoaded', () => {
    openDatabase();
  });

  function openDatabase() {
    const request = indexedDB.open('LinkManagerDB', 1);

    request.onupgradeneeded = function (event) {
      db = event.target.result;
      if (!db.objectStoreNames.contains('links')) {
        db.createObjectStore('links', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = function (event) {
      db = event.target.result;
      renderLinks();
    };

    request.onerror = function () {
      alert('Không thể mở IndexedDB!');
    };
  }

  function addLink() {
    const title = document.getElementById('linkTitle').value.trim();
    const url = document.getElementById('linkUrl').value.trim();
    const type = document.getElementById('linkType').value;
    const imageInput = document.getElementById('linkImage');

    if (!title || !url) {
      alert('Vui lòng nhập đủ tiêu đề và URL');
      return;
    }

    const store = db.transaction(['links'], 'readwrite').objectStore('links');

    function save(data) {
      store.add(data).onsuccess = () => {
        resetForm();
        renderLinks();
      };
    }

    if (imageInput.files[0]) {
      resizeImage(imageInput.files[0], 200, 200, (imageData) => {
        save({ title, url, type, imageData });
      });
    } else {
      save({ title, url, type });
    }
  }

  function resizeImage(file, maxWidth, maxHeight, callback) {
    const reader = new FileReader();
    reader.onload = function (event) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }
        if (height > maxHeight) {
          width *= maxHeight / height;
          height = maxHeight;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function deleteLink(indexInPage) {
    getAllLinks((allLinks) => {
      const globalIndex = (currentPage - 1) * itemsPerPage + indexInPage;
      const item = allLinks[globalIndex];
      if (!item) return;

      if (confirm('Bạn có chắc muốn xóa link này?')) {
        const store = db.transaction(['links'], 'readwrite').objectStore('links');
        store.delete(item.id).onsuccess = () => {
          renderLinks();
        };
      }
    });
  }

  function getAllLinks(callback) {
    const store = db.transaction(['links'], 'readonly').objectStore('links');
    const request = store.getAll();
    request.onsuccess = () => callback(request.result);
  }

  function getTotalPages(count) {
    return Math.ceil(count / itemsPerPage) || 1;
  }

  function changePage(newPage) {
    getAllLinks((allLinks) => {
      const totalPages = getTotalPages(allLinks.length);
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderLinks();
      }
    });
  }

  function jumpToPage() {
    const pageInput = parseInt(document.getElementById('jumpToPage').value);
    if (!isNaN(pageInput)) {
      changePage(pageInput);
    }
  }

  function renderLinks() {
    const linksList = document.getElementById('linksList');
    const currentDisplay = document.getElementById('currentPageDisplay');
    const totalDisplay = document.getElementById('totalPagesDisplay');

    getAllLinks((allLinks) => {
      const totalPages = getTotalPages(allLinks.length);
      const start = (currentPage - 1) * itemsPerPage;
      const currentLinks = allLinks.slice(start, start + itemsPerPage);

      currentDisplay.innerText = currentPage;
      totalDisplay.innerText = totalPages;

      if (currentLinks.length === 0) {
        linksList.innerHTML = '<div class="empty-state">Chưa có link nào được thêm</div>';
        return;
      }

      linksList.innerHTML = '';
      currentLinks.forEach((link, index) => {
        const linkItem = document.createElement('div');
        linkItem.className = 'link-item';
        linkItem.innerHTML = `
          <div class="link-info">
            ${link.imageData ? `<img src="${link.imageData}" alt="Ảnh ${link.title}" style="max-width:100px; max-height:100px; border-radius:4px; margin-right:10px;">` : ''}
            <span class="link-title">${link.title}</span>
            <span class="link-type">${link.type === 'truyen' ? 'Truyện' : 'Video'}</span>
            <a href="${link.url}" target="_blank" class="link-url">${link.url}</a>
          </div>
          <div class="link-actions">
            <button onclick="deleteLink(${index})">Xóa</button>
          </div>
        `;
        linksList.appendChild(linkItem);
      });
    });
  }

  function resetForm() {
    document.getElementById('linkTitle').value = '';
    document.getElementById('linkUrl').value = '';
    document.getElementById('linkImage').value = '';
  }
</script>
</body>
</html>
